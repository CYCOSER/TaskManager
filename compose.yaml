services:
  php:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      DATABASE_URL: "mysql://symfony:symfony@database:3306/app?serverVersion=8.0.32"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f"
      REDIS_URL: "redis://cache:6379"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    networks:
      - app-network

  cache:
    image: redis:alpine
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
